name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Copy local Bible JSON data into built docs
        run: mkdir -p docs/js && cp -R js/leb docs/js/leb

      - name: Copy custom domain file into built docs
        run: cp CNAME docs/CNAME

      - name: Commit built docs
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: "chore: rebuild docs for GitHub Pages"
          add: "docs"
          push: true
